<!doctype html>
<html><head><meta charset="utf-8"><title>App icon render</title>
<!-- Source for src/assets/icon_android.png: blue outline biceps in a blue square on #141414 (blog look).
     Render: see docs/icon/README.md. The biceps is 110 x 110 units (square), centered at 75/75, so the
     gap to the square is the same on all four sides. The outer group scales the whole logo to 80 %
     (square side 60): at 100 % the phone's launcher cut off the square's corners. -->
<style>html,body{margin:0;width:1024px;height:1024px;overflow:hidden;background:#141414}svg{display:block;width:1024px;height:1024px}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150"><rect width="150" height="150" fill="#141414"/><g transform="translate(75 75) scale(.8) translate(-75 -75)"><rect x="37.5" y="37.5" width="75" height="75" fill="none" stroke="#1f5fff" stroke-width="3"/><path d="M20 78 L82 78 L82 101 L108 101 L108 38 L96 38 L96 20 L130 20 L130 130 L20 130 Z" fill="none" stroke="#1f5fff" stroke-width="6" transform="translate(75 75) scale(.5) translate(-75 -75)"/></g></svg>
</body></html>
