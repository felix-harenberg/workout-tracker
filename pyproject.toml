[project]
name = "workout-tracker"
version = "0.2.0"
description = "Offline Android app to log strength training and runs."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Felix Harenberg" }]
license = "MIT"
dependencies = ["flet>=1.0,<2"]

[project.optional-dependencies]
dev = ["flet[all]>=1.0,<2", "pytest>=9", "ruff>=0.17"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.flet]
# Android package id is org + project name. Changing it later installs a separate app.
org = "io.github.felixharenberg"
product = "Workout Tracker"

[tool.flet.app]
path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
