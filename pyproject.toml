[project]
name = "workout-tracker"
version = "0.5.1"
description = "Offline Android app to log strength training."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Felix Harenberg" }]
license = "MIT"
dependencies = ["flet>=1.0,<2", "flet-charts>=1.0,<2"]

[project.optional-dependencies]
dev = ["flet[all]>=1.0,<2", "pytest>=9", "ruff>=0.17"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.flet]
# Android package id is org + project name. Changing it later installs a separate app.
org = "io.github.felixharenberg"
product = "Workout Tracker"

[tool.flet.app]
path = "src"

# Phones from the last ~8 years are arm64. Skipping armeabi-v7a (very old phones) and
# x86_64 (emulators) makes the APK much smaller and the build faster, with fewer downloads
# that can fail (a corrupt x86_64 Python download broke a build once).
[tool.flet.android]
target_arch = ["arm64-v8a"]

# Splash shows src/assets/splash_android.png on the app background, light and dark mode alike.
[tool.flet.splash]
color = "#07060A"
dark_color = "#07060A"
icon_background = "#07060A"
icon_dark_background = "#07060A"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
