name: Build APK

on:
  push:
    # design/* branches get test APKs too, for trying a look on the phone before merging.
    branches: [main, "design/**"]
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
  # Also used as a building block by release.yml for tagged releases.
  workflow_call:

# A newer push makes an older, still running build pointless.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: 1
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, for the commit count below

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Flet CLI
        run: pip install "flet[all]>=1.0,<2"

      # A fixed signing key lets new versions install over old ones without losing data.
      # Without the secrets (e.g. in forks) flet falls back to a throwaway debug key.
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "FLET_ANDROID_SIGNING_KEY_STORE=$RUNNER_TEMP/upload-keystore.jks"
            echo "FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "FLET_ANDROID_SIGNING_KEY_PASSWORD=$KEYSTORE_PASSWORD"
            echo "FLET_ANDROID_SIGNING_KEY_ALIAS=upload"
          } >> "$GITHUB_ENV"

      # Android only installs an update with a higher build number. The commit count grows
      # with every commit no matter which workflow builds, so release builds and regular
      # builds share one increasing sequence (a per-workflow run number would restart at 1).
      - name: Compute build number
        run: echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      # flet build downloads the matching Flutter SDK, JDK and Android SDK itself.
      - name: Build APK
        run: flet build apk --verbose --yes --build-number "$BUILD_NUMBER"

      - uses: actions/upload-artifact@v4
        with:
          name: workout-tracker-apk
          path: build/apk/*.apk
          if-no-files-found: error
